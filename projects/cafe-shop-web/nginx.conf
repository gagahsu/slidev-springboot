# Docker ch06：Nginx 同時做兩件事
#   1. 提供 Angular 打包好的靜態檔案
#   2. /api 和 /uploads 反向代理到後端容器 api（服務名稱就是主機名稱）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 用 Docker 內建的 DNS 查 api 的 IP，每 10 秒重查一次：
    # api 還沒啟動 Nginx 也能先開；api 重建換了 IP 也找得到
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    # 後台上傳圖片上限 2MB（後端也有限制），這裡放寬一點
    client_max_body_size 5m;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $api;
        expires 7d;
    }

    # Angular 的路由（/products/1、/admin/orders…）都交給 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不快取，改版後使用者重新整理就拿到新版
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

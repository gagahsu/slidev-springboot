# Docker ch05、ch08：Nginx 同時做兩件事
#   1. 提供 Angular 打包好的靜態檔案
#   2. /api 和 /uploads 反向代理到後端容器 api（服務名稱就是主機名稱，Docker ch06）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 後台上傳圖片上限 2MB（後端也有限制），這裡放寬一點
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        expires 7d;
    }

    # Angular 的路由（/products/1、/admin/orders…）都交給 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不快取，改版後使用者重新整理就拿到新版
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

spring.application.name=cafe-shop-api
# 開發時預設用 dev profile（模擬付款只在 dev 開放）
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# 資料庫：cafe_shop 要先建好（CREATE DATABASE cafe_shop），資料表由 Flyway 建立
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cafe_shop}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# MyBatis：報表的 SQL 寫在 resources/mapper/*.xml
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# JWT（正式環境一定要用環境變數換掉）
jwt.secret=${JWT_SECRET:corner-cafe-shop-dev-secret-key-at-least-32-bytes}
jwt.expire-minutes=120

# 上傳圖片
spring.servlet.multipart.max-file-size=2MB
app.upload-dir=${UPLOAD_DIR:uploads}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# 綠界全方位金流：測試環境（官方文件公開的測試特店）
ecpay.merchant-id=${ECPAY_MERCHANT_ID:3002607}
ecpay.hash-key=${ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}
ecpay.hash-iv=${ECPAY_HASH_IV:EkRm7iFT261dpevs}
ecpay.payment-url=https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5
ecpay.query-url=https://payment-stage.ecpay.com.tw/Cashier/QueryTradeInfo/V5
# 綠界伺服器要連得到：開發時用 Cloudflare Tunnel 的網址，例如 https://xxx.trycloudflare.com/api/payments/ecpay/notify
ecpay.return-url=${ECPAY_RETURN_URL:http://localhost:8080/api/payments/ecpay/notify}
ecpay.order-result-url=${ECPAY_ORDER_RESULT_URL:http://localhost:8080/api/payments/ecpay/result}

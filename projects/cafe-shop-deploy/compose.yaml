# 轉角咖啡線上商店：一行指令啟動三個服務（SHOP-SPEC §10、Docker ch05–08）
#
#   cp .env.example .env      # 第一次：複製設定檔，改掉密碼和金鑰
#   docker compose up -d --build
#   開 http://localhost       # 前台；後台 http://localhost/admin（admin@cornercafe.test / Admin1234）
#
# 這個資料夾和 cafe-shop-api、cafe-shop-web 放在同一層（build 用相對路徑找到它們）。

name: cafe-shop

services:
  db:
    image: mysql:9.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: cafe_shop          # 第一次啟動時自動建立資料庫，資料表交給 Flyway
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Taipei
      LANG: C.UTF-8                      # docker compose exec db mysql 打中文才不會變亂碼
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db-data:/var/lib/mysql           # 資料庫檔案（Docker ch07）
    healthcheck:                         # 真的能連線了才算「健康」，api 才開始啟動（Docker ch05）
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 10
      start_period: 30s
    # 想用 MySQL Workbench 連進來看資料，就把下面兩行打開（本機的 3307 → 容器的 3306）
    # ports:
    #   - "3307:3306"

  api:
    build: ../cafe-shop-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://db:3306/cafe_shop   # 主機名稱 db = 服務名稱（Docker ch06）
      DB_USERNAME: shop
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${PUBLIC_URL}
      ECPAY_MERCHANT_ID: ${ECPAY_MERCHANT_ID}
      ECPAY_HASH_KEY: ${ECPAY_HASH_KEY}
      ECPAY_HASH_IV: ${ECPAY_HASH_IV}
      ECPAY_RETURN_URL: ${ECPAY_PUBLIC_URL:-http://localhost}/api/payments/ecpay/notify
      ECPAY_ORDER_RESULT_URL: ${PUBLIC_URL}/api/payments/ecpay/result
      TZ: Asia/Taipei
    volumes:
      - uploads:/app/uploads             # 後台上傳的商品圖片（Docker ch07）
    # 不開 ports：外面只能透過 web（Nginx）的 /api 連進來

  web:
    build: ../cafe-shop-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db-data:
  uploads:

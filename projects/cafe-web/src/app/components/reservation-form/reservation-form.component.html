<section id="reservation" class="section">
  <h2 class="section-title">線上訂位</h2>

  <form class="form" (ngSubmit)="submit()">
    <label>
      姓名 *
      <input name="name" [(ngModel)]="form.name" maxlength="20" />
      @if (errors['name']) { <span class="error">{{ errors['name'] }}</span> }
    </label>

    <label>
      手機 *
      <input name="phone" [(ngModel)]="form.phone" placeholder="0912345678" />
      @if (errors['phone']) { <span class="error">{{ errors['phone'] }}</span> }
    </label>

    <label class="wide">
      Email（選填）
      <input name="email" type="email" [(ngModel)]="form.email" />
      @if (errors['email']) { <span class="error">{{ errors['email'] }}</span> }
    </label>

    <label>
      日期 *
      <input name="reserveDate" type="date" [(ngModel)]="form.reserveDate" [min]="minDate" [max]="maxDate" />
      @if (errors['reserveDate']) { <span class="error">{{ errors['reserveDate'] }}</span> }
    </label>

    <label>
      時段 *
      <select name="reserveTime" [(ngModel)]="form.reserveTime">
        <option value="">請選擇</option>
        @for (t of timeSlots; track t) {
          <option [value]="t">{{ t }}</option>
        }
      </select>
      @if (errors['reserveTime']) { <span class="error">{{ errors['reserveTime'] }}</span> }
    </label>

    <label>
      人數 *
      <input name="people" type="number" min="1" max="8" [(ngModel)]="form.people" />
      @if (errors['people']) { <span class="error">{{ errors['people'] }}</span> }
    </label>

    <label class="wide">
      備註
      <textarea name="note" rows="3" [(ngModel)]="form.note" maxlength="200"></textarea>
      @if (errors['note']) { <span class="error">{{ errors['note'] }}</span> }
    </label>

    <button type="submit" class="wide" [disabled]="sending">{{ sending ? '送出中…' : '送出訂位' }}</button>

    @if (message) {
      <p class="wide message">{{ message }}</p>
    }
  </form>
</section>

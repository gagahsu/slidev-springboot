spring.application.name=dynamic-survey

# Database（先在 MySQL 執行 schema.sql / seed.sql）
spring.datasource.url=jdbc:mysql://localhost:3306/dynamic_survey?serverTimezone=Asia/Taipei&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=root1234

# JPA：表由 schema.sql 建立，Hibernate 只負責驗證欄位對得上
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 健康檢查：只公開 /actuator/health（Docker 的 healthcheck 用）
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT（開發用假密鑰；正式環境改用環境變數 JWT_SECRET）
jwt.secret=NDI2ZTQ3M2E0MjY1NTk3MDRlNTgzODJlNmU2MzM0MzQzMzM2MzY3Mzc3

# 日誌：自己的套件開 DEBUG，其餘維持 INFO，同時寫到檔案並依大小滾動
logging.level.root=INFO
logging.level.com.example.survey=DEBUG
logging.file.name=logs/dynamic-survey.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

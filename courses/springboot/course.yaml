# 課程設定。資料夾名稱（springboot）就是課程代碼，也是網址的一部分：#/springboot/ch04/3
# 章節檔案：同一個資料夾裡的 NN-主題.md（NN 兩位數），章節代碼是 chNN。

title: Spring Boot Backend Masterclass
# 側欄、搜尋結果等空間較小的地方用的短名
short: Spring Boot
description: 從 Spring 核心、MVC、資料庫一路到安全與微服務，最後完成轉角咖啡的前後端串接與「線上商店」後端（購物車、訂單、綠界金流）。
# 課程卡片上的字（1–2 個字元）與主色：green / blue / purple / orange / pink / teal / yellow
logo: S
color: green
# 選擇課程頁的排序（小的在前）
order: 1
# 舊網址 #/ch04/3（還沒有多門課程時的網址）轉到這門課。全站只能有一門課設成 true。
legacy: true
# 搜尋框的範例關鍵字
searchHint: "@Autowired、交易、JWT"
# `pnpm -C site export springboot` 合併 PDF 的檔名
pdfName: spring-boot-masterclass

# 單元分組：from / to 是章節編號（含頭尾）
units:
  - { title: Spring 核心, desc: Spring Boot 入門、IoC、DI、Bean 與 AOP, from: 1, to: 11, color: green }
  - { title: Spring MVC 與 RESTful API, desc: HTTP、JSON、請求參數與 API 設計, from: 12, to: 21, color: blue }
  - { title: 資料庫存取, desc: Spring JDBC、JPA、MyBatis、交易與鎖, from: 22, to: 35, color: purple }
  - { title: 架構與實務, desc: MVC 分層、資料物件、API 文件與驗證, from: 36, to: 41, color: orange }
  - { title: 進階功能, desc: Session、測試與日誌、排程、快取, from: 42, to: 45, color: pink }
  - { title: 安全與微服務, desc: Spring Security、JWT、Spring Cloud, from: 46, to: 48, color: teal }
  - { title: 實戰專題, desc: 前後端串接、轉角咖啡與線上商店, from: 49, to: 99, color: yellow }


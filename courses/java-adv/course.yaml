# 課程設定。內容來自 gagahsu/slidev-java 的進階檔 chNN-主題-adv.md。
# 章號跟 courses/java/ 對齊：java-adv 的 ch10 就是 java ch10「類別與物件」的進階內容；沒有進階檔的章號（1–3、9、28）空著。

title: Java 程式設計（進階・自學）
short: Java 進階
description: 每章的進階與自學內容：位元運算、新版 switch、Records、Sealed Classes、設計模式、多執行緒、I/O 與 Stream 進階用法。
logo: J+
color: yellow
order: 6
searchHint: "record、sealed、Optional"
pdfName: java-advanced

units:
  - { title: 基礎語法, desc: 變數、運算、流程控制、迴圈、陣列、方法, from: 1, to: 9, color: green }
  - { title: 物件導向, desc: 類別與物件、封裝、常用類別、繼承、抽象類別、介面、套件, from: 10, to: 21, color: blue }
  - { title: 例外與自學主題, desc: 例外處理；多執行緒、I/O、壓縮為自學, from: 22, to: 25, color: purple }
  - { title: 集合與現代 API, desc: 集合框架、Stream 與 Lambda、總複習, from: 26, to: 28, color: orange }

